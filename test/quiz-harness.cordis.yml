# Dev overlay for the quiz verification harness (channel ①):
#   dsh web --patch ./test/quiz-harness.cordis.yml --no-open
# Boots the web profile with dsh-learn-plugin (built lib) + the harness, which prints
# a PASS/FAIL report to stdout. Inserted ./ ../ paths anchor to this file's directory.
- insert:
    - id: dsh-learn-plugin
      name: ../dist/lib/index.js
    - id: dsh-learn-plugin-quiz-harness
      name: ./quiz-harness.ts
