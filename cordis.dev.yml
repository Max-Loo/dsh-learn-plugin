# Dev overlay (channel ①) for loading dsh-learn-plugin without installing it.
#
# The tutorial requires the plugin path to be absolute: patch files only
# contribute configuration; the loader resolves module paths from the
# profile directory. Replace the path below when working from another
# checkout, then boot with:
#
#   dsh web --patch ./cordis.dev.yml
#
# (from a deepseek-harness source checkout: `pnpm dsh web --patch ...`)
#
# Points at the built entry (run `pnpm run build` in this directory after
# editing src/) — the source-checkout TS loader cannot map NodeNext `.js`
# sibling imports back to `.ts`.
- insert:
    - id: dsh-learn-plugin
      name: /Users/luyuexing/Documents/projects/personal/dsh-learn-plugin/dist/lib/index.js
